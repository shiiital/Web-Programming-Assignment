<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>😂 Random Joke Fetcher</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #fdf6f0;
      color: #444;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #6a5acd;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background-color: #a8e6cf;
      color: #333;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #81c784;
      color: white;
    }
    .section {
      background-color: #fff;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: left;
    }
    .section h2 {
      color: #6a5acd;
      margin-bottom: 10px;
    }
    #setup, #punchline, #favourites {
      font-size: 16px;
      color: #555;
    }
    #saveBtn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>😂 Random Joke Fetcher 🎉</h1>
  <button onclick="loadJoke()">🎲 Load Joke</button>

  <div class="section">
    <h2>👉 Setup</h2>
    <p id="setup">Click Load Joke to get a joke.</p>
  </div>

  <div class="section">
    <h2>🤣 Punchline</h2>
    <p id="punchline"></p>
    <button id="saveBtn" onclick="saveFavourite()" disabled>💾 Save Favourite</button>
  </div>

  <div class="section">
    <h2>⭐ Favourite Jokes</h2>
    <p id="favourites">No favourite jokes saved yet.</p>
  </div>

  <script>
    let currentJoke = {};
    let favourites = [];

    async function loadJoke() {
      const response = await fetch("https://official-joke-api.appspot.com/random_joke");
      const data = await response.json();
      currentJoke = data;
      document.getElementById("setup").textContent = "👉 " + data.setup;
      document.getElementById("punchline").textContent = "🤣 " + data.punchline;
      document.getElementById("saveBtn").disabled = false;
    }

    function saveFavourite() {
      favourites.push(currentJoke);
      updateFavourites();
      document.getElementById("saveBtn").disabled = true;
    }

    function updateFavourites() {
      const favDiv = document.getElementById("favourites");
      favDiv.innerHTML = "";
      favourites.forEach(joke => {
        favDiv.innerHTML += "⭐ " + joke.setup + " — " + joke.punchline + "<br>";
      });
    }
  </script>
</body>
</html>
