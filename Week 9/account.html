<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Sign Up</title>
  <style>
    body {
      font-family: 'Monocursive', cursive;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      width: 400px;
    }
    h1 {
      text-align: center;
      font-size: 2.5em;
      color: #6a0572;
      margin-bottom: 25px;
    }
    .help {
      text-align: right;
      margin-bottom: 20px;
    }
    .help button {
      background-color: #ff6f91;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      font-size: 1em;
      cursor: pointer;
    }
    .help button:hover {
      background-color: #d6336c;
    }
    label {
      display: block;
      margin: 15px 0 5px;
      font-size: 1.1em;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #6a0572;
      border-radius: 10px;
      font-size: 1.1em;
    }
    input:focus {
      outline: none;
      border-color: #ff6f91;
      box-shadow: 0 0 8px #ff6f91;
    }
    button.submit {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background-color: #6a0572;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.3em;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button.submit:hover {
      background-color: #45034d;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <div class="help">
      <button>? Help</button>
    </div>
    <h1>Create an Account</h1>
    <form>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>

      <button type="submit" class="submit">Create Account</button>
    </form>
  </div>
</body>
</html>
