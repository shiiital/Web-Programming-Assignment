<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Search</title>
  <style>
    body {
      font-family: 'Dancing Script', cursive;
      background: linear-gradient(135deg, #ffdee9, #b5fffc);
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 25px;
      font-size: 3em;
      color: #ff6f91;
      text-shadow: 2px 2px #fff;
    }
    .search-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px;
    }
    input[type="text"] {
      width: 500px;
      padding: 15px;
      border: 3px solid #ff6f91;
      border-radius: 10px;
      font-size: 1.2em;
      font-family: 'Poppins', sans-serif;
    }
    button {
      padding: 15px 25px;
      margin-left: 15px;
      background-color: #ff6f91;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff3f6d;
    }
    .cat {
      width: 80px;
      margin-left: 20px;
    }
    .results {
      margin: 20px auto;
      width: 80%;
      max-width: 700px;
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      font-family: 'Poppins', sans-serif;
    }
    .book {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }
    .book:last-child {
      border-bottom: none;
    }
    .book-title {
      font-weight: bold;
      color: #333;
    }
    .book-author {
      color: #777;
    }
  </style>
</head>
<body>
  <header>Book Search</header>
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search by title or author">
    <button onclick="searchBooks()">Search</button>
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Cute Cat" class="cat">
  </div>
  <div class="results" id="results">Enter a book title or author to get started.</div>

  <script>
    async function searchBooks() {
      const query = document.getElementById('searchInput').value;
      const resultsDiv = document.getElementById('results');
      if (!query) {
        resultsDiv.innerHTML = "Please enter a search term.";
        return;
      }
      const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}`);
      const data = await response.json();
      if (data.docs.length === 0) {
        resultsDiv.innerHTML = "No results found.";
        return;
      }
      resultsDiv.innerHTML = data.docs.slice(0, 10).map(book => `
        <div class="book">
          <div class="book-title">${book.title}</div>
          <div class="book-author">${book.author_name ? book.author_name.join(', ') : 'Unknown Author'}</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
