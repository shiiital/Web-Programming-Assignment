<!DOCTYPE html>
<html>
  <body style="font-family:system-ui;padding:24px;text-align:center">
    <style>
      .done {
        background: #7e22ce !important; /* Purplish color */
      }
    </style>

    <button id="clicker" 
      style="padding:14px 32px;font-size:18px;border:none;
             background:#1a56db;color:white;border-radius:10px;
             cursor:pointer;transition:background .3s">
      Click me!
    </button>

    <p id="count" style="font-size:32px;font-weight:bold;margin:16px 0">0</p>
    <p id="message" style="font-size:16px;color:#666">Keep clicking...</p>

    <script>
      // Select elements
      const button = document.querySelector("#clicker");
      const countText = document.querySelector("#count");
      const message = document.querySelector("#message");

      // Counter variable
      let count = 0;

      // Add click listener
      button.addEventListener("click", () => {
        count++;
        countText.textContent = count;

        if (count >= 5) {
          button.classList.add("done");
          message.textContent = "🎉 Congratulations! You did it!";
        }
      });
    </script>
  </body>
</html>
