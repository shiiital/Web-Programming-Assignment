
<!DOCTYPE html>
<html>
  <body style="font-family:system-ui;padding:24px;display:flex;justify-content:center">
    <style>
      .card {
        padding: 24px;
        border-radius: 16px;
        width: 260px;
        background: #f0f4ff;
        border: 2px solid #c8d4f0;
        text-align: center;
        transition: all 0.3s;
      }
      .card.dark {
        background: #1a2340;
        border-color: #3a4a70;
        color: white;
      }
      .avatar {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #f9c5d5; /* pastel pink for cuteness */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin-bottom: 12px;
      }
      button {
        padding: 8px 20px;
        border-radius: 20px;
        cursor: pointer;
        border: none;
        margin-top: 14px;
        font-weight: bold;
      }
    </style>

    <div id="card" class="card">
      <div class="avatar">🐰</div>
      <h2>Shital Achhami</h2>
      <p>Web Programming Student</p>
      <button id="toggle-btn">🌙 Dark Mode</button>
    </div>

    <script>
      // Select card and button
      const card = document.querySelector("#card");
      const toggleBtn = document.querySelector("#toggle-btn");

      // Add click listener
      toggleBtn.addEventListener("click", () => {
        // Toggle dark class
        card.classList.toggle("dark");

        // Update button text
        if (card.classList.contains("dark")) {
          toggleBtn.textContent = "☀️ Light Mode";
        } else {
          toggleBtn.textContent = "🌙 Dark Mode";
        }
      });
    </script>
  </body>
</html>
