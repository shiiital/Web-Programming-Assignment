<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Validation Styles</title>
  <style>
    body {
      font-family: 'Monocursive', cursive;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      width: 400px;
    }
    h1 {
      text-align: center;
      font-size: 2.5em;
      color: #d6336c;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin: 15px 0 5px;
      font-size: 1.2em;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #d6336c;
      border-radius: 10px;
      font-size: 1.1em;
    }
    input:focus {
      outline: none;
      border-color: #ff6f91;
      box-shadow: 0 0 8px #ff6f91;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background-color: #d6336c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.3em;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #a61e4d;
    }
    .note {
      text-align: center;
      margin-top: 15px;
      font-size: 1em;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h1>Validation Styles</h1>
    <form>
      <label for="studentId">Student ID</label>
      <input type="text" id="studentId" name="studentId" value="202112345" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="name@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>

      <button type="submit">Submit</button>
    </form>
    <div class="note">Try invalid values to see validation messages.</div>
  </div>
</body>
</html>
